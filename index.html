<body><main>
<h1>Puffer party</h1>
<p class="sub">Answer before the puffer pops. Rarer answers score more.</p>

<div id="home" class="card">
 <input id="nm" maxlength="12" placeholder="Your name" autocomplete="off">
 <button id="mk">Create room</button>
 <input id="rc" maxlength="4" placeholder="Room code" autocomplete="off" style="text-transform:uppercase">
 <button id="jn" class="alt">Join room</button>
 <button id="pub" class="alt">Join public room</button>
 <button id="tn" class="alt" style="opacity:.75">Test my connection</button>
 <div class="msg" style="font-size:13px;opacity:.6">Version: 18 Nov 2026 · public rooms</div>
</div>

<div id="lobby" class="card hid">
 <button type="button" id="openSettings" class="alt settings-trigger" aria-haspopup="dialog" aria-controls="settingsPopup">⚙ Settings</button>
 <button type="button" id="leaveLobby" class="alt leave-room">← Leave room</button>
 <div class="msg" id="rcm">Room code. Share it with your friends.</div>
 <div class="code" id="rc2"></div>
 <div id="pl1"></div>
 <div class="settings-backdrop hid" id="settingsBackdrop">
  <section class="card settings-popup" id="roomSettings" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
   <div class="settings-heading"><h2 id="settingsTitle">Room settings</h2><button type="button" id="closeSettings" class="alt settings-close" aria-label="Close settings">✕</button></div>
   <label for="settingStarting">Starting lives</label><input id="settingStarting" type="number" min="1" max="20" step="1" value="2">
   <label for="settingMax">Max lives</label><input id="settingMax" type="number" min="1" max="20" step="1" value="5">
   <label for="settingCountdown">Minimum countdown (seconds)</label><input id="settingCountdown" type="number" min="5" max="60" step="1" value="5">
   <button type="button" id="resetSettings" class="alt">Reset settings to defaults</button>
   <div class="msg" id="settingsStatus" aria-live="polite"></div>
  </section>
 </div>
 <button id="st">Start game</button>
 <div class="msg" id="wt"></div>
</div>

<div id="game" class="hid">
 <div class="hud">
  <button type="button" id="leaveGame" class="alt leave-room">← Leave room</button>
  <div class="badge"><small>Room</small><b id="hroom"></b></div>
  <div class="depth" id="depth"></div>
  <div class="badge r"><small>Alive</small><b id="halive"></b></div>
 </div>
 <div class="ptitle"><small id="plab"></small><div class="prompt" id="pr"></div><div class="who" id="who"></div></div>
 <div id="arena"><div id="seats"></div><div id="puff"></div></div>
 <div class="msg" id="mg"></div>
 <div class="dock">
  <div class="lives" id="mylives"></div>
  <div class="inwrap"><div id="err"></div><input id="ans" type="text" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" data-gramm="false" data-gramm_editor="false" data-enable-grammarly="false" data-lpignore="true" enterkeyhint="send" placeholder="Type your answer"><div class="bar"><i id="fuse"></i></div><div class="legend"><i class="t1"></i>plankton<i class="t2"></i>too clever<i class="t3"></i>schooler<i class="t4"></i>rare<i class="t5"></i>deep cut<i class="t6"></i>one in a krillion</div></div>
  <button id="go">Send</button>
 </div>
</div>

<div id="over" class="card hid">
 <div class="prompt" id="win"></div>
 <div id="pl3"></div>
 <button id="showmiss" class="hid">Show rejected answers</button><div class="msg hid" id="misslist" style="text-align:left;max-height:34vh;overflow:auto;line-height:1.5"></div><button id="again">Back to lobby</button>
 <div class="msg" id="wt2"></div>
</div>

function readSeen(){try{return JSON.parse(localStorage.getItem('bbash-seen')||'[]')}catch(e){return[]}}
function markSeen(i){const s=readSeen();if(s.indexOf(i)<0)s.push(i);try{localStorage.setItem('bbash-seen',JSON.stringify(s))}catch(e){}}
function newDeck(last,played){
  played=played||[];
  let seen=readSeen(),ids=CATS.map((_,i)=>i).filter(i=>seen.indexOf(i)<0&&played.indexOf(i)<0);
  if(ids.length<10){ // the long-term memory is used up: start it over, but keep this game's prompts out
    try{localStorage.setItem('bbash-seen',JSON.stringify(played))}catch(e){}
    ids=CATS.map((_,i)=>i).filter(i=>played.indexOf(i)<0);
    if(ids.length<10)ids=CATS.map((_,i)=>i); // a truly enormous game has played almost every prompt
  }
  for(let i=ids.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[ids[i],ids[j]]=[ids[j],ids[i]]}
  if(ids.length>1&&ids[ids.length-1]===last)ids.reverse();
  return ids;
}

// public rooms: PUBLIC, PUBLIC2, PUBLIC3... Nobody has to share a code. If nobody is hosting a slot, you open it; if it is full or already playing, you try the next one.
function pubRoom(n){pubN=n||1;if(++pubTry>25)return net('Could not find an open public room. Try again in a moment.',1);joinRoom('PUBLIC'+(pubN>1?pubN:''))}
function joinRoom(fixed){
  intentionalLeave=false;
  const pub=typeof fixed==='string';
  nm=$('nm').value.trim()||'Player';room=pub?fixed:$('rc').value.trim().toUpperCase();
  if(!pub&&room.length!==4)return net('Enter the 4-letter room code.',1);
  let got=false,moved=false;net(pub?'Looking for a public room...':'Connecting to the server...');
  const openIt=()=>{if(moved||got)return;moved=true;try{peer.destroy()}catch(e){}host(room)};
  const nextOne=()=>{if(moved)return;moved=true;try{peer.destroy()}catch(e){}pubRoom(pubN+1)};
  peer=new Peer(undefined,{config:ICE});
  peer.on('open',id=>{
    me=id;net(pub?'Looking for a public room...':'Looking for room '+room+'...');conn=peer.connect('bbash-'+room,{reliable:true});
    const to=setTimeout(()=>{if(got)return;if(pub)return openIt();net('Found the server but could not reach the host. School Wi-Fi often blocks device-to-device connections. Try a phone hotspot, or ask the host to try one. The "Test my connection" button can tell you what is blocked.',1)},pub?9000:15000);
    conn.on('open',()=>{net('Joining...');conn.send({t:'join',n:nm})});
    conn.on('iceStateChanged',st=>{if(st==='failed'&&!got){if(pub)return openIt();net('The connection to the host failed. This network may be blocking it. Try a phone hotspot or home Wi-Fi.',1)}});
    conn.on('error',e=>{if(pub)return openIt();net(NETERR(e),1)});
    conn.on('data',d=>{
      if(d.t==='s'){got=true;clearTimeout(to);net('');render(d.s)}
      else if(d.t==='bad')flash(d.m);else if(d.t==='typ')onTyp(d.id,d.x);
      else if(d.t==='full'){if(pub){clearTimeout(to);nextOne()}else{alert('That room is full or already started.');location.reload()}}
    });
    conn.on('close',()=>{if(moved||intentionalLeave)return;if(got){alert('Disconnected from the room.');location.reload()}else if(pub){clearTimeout(to);openIt()}else net('The host closed the connection.',1)});
  });

}
// finds out what is blocking connections on this device or network
async function testNet(){
  const out=[];const log=(ok,t)=>{out.push((ok?'OK: ':'PROBLEM: ')+t);net(out.join('\n'),!ok)};$('net').style.whiteSpace='pre-line';net('Testing...');
  try{
    log(typeof Peer!=='undefined','the game\'s connection library '+(typeof Peer!=='undefined'?'loaded':'did not load (cdn.jsdelivr.net may be blocked)'));
    const RTC=window.RTCPeerConnection||window.webkitRTCPeerConnection;
    log(!!RTC,'this browser '+(RTC?'supports live connections (WebRTC)':'has WebRTC turned off or blocked, so it cannot join rooms'));
    const ws=await new Promise(r=>{let done=false;const f=v=>{if(!done){done=true;r(v)}};try{const w=new WebSocket('wss://0.peerjs.com/peerjs?key=peerjs&id=t'+Math.random().toString(36).slice(2)+'&token=t');w.onopen=()=>{f(true);try{w.close()}catch(e){}};w.onerror=()=>f(false);setTimeout(()=>f(false),7000)}catch(e){f(false)}});
    log(ws,'the matchmaking server (0.peerjs.com) is '+(ws?'reachable':'NOT reachable, it is blocked on this network or device'));
    if(RTC){
      const t=await new Promise(res=>{const seen={};let pc;try{pc=new RTC(ICE);pc.createDataChannel('x');pc.onicecandidate=e=>{if(e.candidate){const m=/ typ (\w+)/.exec(e.candidate.candidate);if(m)seen[m[1]]=1}};pc.createOffer().then(o=>pc.setLocalDescription(o)).catch(()=>{});}catch(e){return res(seen)}setTimeout(()=>{try{pc.close()}catch(e){}res(seen)},6000)});
      log(!!t.srflx,'finding this device\'s public address (STUN) '+(t.srflx?'works':'is blocked'));
      log(!!t.relay,'the backup relay (TURN) '+(t.relay?'works':'is blocked or down'));
      const good=ws&&(t.srflx||t.relay);
      out.push(good?'\nThis device looks fine. If joining still fails, the other player\'s network is probably the problem.':(ws?'\nDirect connections look blocked here. Try a different network, or a different device.':'\nThis device or network blocks the matchmaking server, so rooms cannot work here.'));net(out.join('\n'),!good);
    }
  }catch(e){log(false,'the test crashed: '+e.message)}
}
