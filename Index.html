<body><main>
<h1>Blowfish Bash</h1>
<p class="sub">Answer before the puffer pops. Rarer answers score more.</p>

<div id="home" class="card">
 <input id="nm" maxlength="12" placeholder="Your name" autocomplete="off">
 <button id="mk">Create room</button>
 <input id="rc" maxlength="4" placeholder="Room code" autocomplete="off" style="text-transform:uppercase">
 <button id="jn" class="alt">Join room</button>
</div>

<div id="lobby" class="card hid">
 <div class="msg">Room code. Share it with your friends.</div>
 <div class="code" id="rc2"></div>
 <div id="pl1"></div>
 <button id="st">Start game</button>
 <div class="msg" id="wt"></div>
</div>

<div id="game" class="hid">
 <div class="hud">
  <div class="badge"><small>Room</small><b id="hroom"></b></div>
  <div class="depth" id="depth"></div>
  <div class="badge r"><small>Alive</small><b id="halive"></b></div>
 </div>
 <div class="ptitle"><small id="plab"></small><div class="prompt" id="pr"></div><div class="who" id="who"></div></div>
 <div id="arena"><div id="seats"></div><div id="puff"></div></div>
 <div class="legend"><i class="t1"></i>common<i class="t2"></i>uncommon<i class="t3"></i>rare<i class="t4"></i>epic<i class="t5"></i>legendary<i class="t6"></i>mythic</div>
 <div class="msg" id="mg"></div>
 <div class="dock">
  <div class="lives" id="mylives"></div>
  <div class="inwrap"><input id="ans" autocomplete="off" autocapitalize="off" placeholder="Type your answer"><div class="bar"><i id="fuse"></i></div></div>
  <button id="go">Send</button>
 </div>
</div>

<div id="over" class="card hid">
 <div class="prompt" id="win"></div>
 <div id="pl3"></div>
 <div class="msg" id="miss"></div><button id="again">Back to lobby</button>
 <div class="msg" id="wt2"></div>
</div>
</main>
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>

    if(conns[c.peer])return;
    if(G.ph!=='lobby'||G.players.length>=5){c.send({t:'full'});setTimeout(()=>c.close(),400);return}
    conns[c.peer]=c;G.players.push({id:c.peer,name:String(d.n||'Player').slice(0,12),lives:3,score:0,alive:true,nl:40});push();
  }else if(d.t==='ans')answer(c.peer,String(d.x||''));
}
function push(){
  const s={ph:G.ph,players:G.players,turn:G.turn,cat:G.cat>=0?CATS[G.cat][0]:'',left:deadline?Math.max(0,deadline-Date.now()):0,tot:G.tot||1,msg:G.msg,pause:G.pause,win:G.win,n:G.n,say:G.say,miss:G.ph==='over'?G.miss:undefined,room};
  Object.values(conns).forEach(c=>c.open&&c.send({t:'s',s}));render(s);
}
const lim=()=>G.players.length>1?1:0;
const ended=()=>G.players.filter(p=>p.alive).length<=lim();
function nextAlive(){let i=G.turn;do{i=(i+1)%G.players.length}while(!G.players[i].alive);return i}
function start(){
  G.players.forEach(p=>{p.lives=3;p.score=0;p.alive=true;p.nl=40});
  G.used={};G.miss=[];G.say=null;G.n=0;G.ph='play';G.win=null;G.msg='';G.turn=Math.random()*G.players.length|0;turn();
}
function turn(){
  if(G.ph!=='play')return;
  if(ended())return end();
  if(!G.players[G.turn].alive)G.turn=nextAlive();
  G.pause=false;G.msg='';G.say=null;G.cat=Math.random()*CATS.length|0;
  G.tot=Math.max(4000,11000-G.n*300);G.n++;
  deadline=Date.now()+G.tot;clearTimeout(timer);timer=setTimeout(pop,G.tot);push();
}
function after(){
  if(ended())return end();
  G.turn=nextAlive();G.pause=true;deadline=0;push();setTimeout(turn,1200);
}
function end(){
  clearTimeout(timer);deadline=0;G.ph='over';G.pause=false;
  const a=G.players.find(p=>p.alive);G.win=a?a.name:null;push();
}
function pop(){
  const p=G.players[G.turn];p.lives--;G.say=null;if(p.lives<=0)p.alive=false;
  G.msg='💥 POP! '+p.name+' lost a life'+(p.alive?'':' and is out!');after();
}
function answer(id,x){
  const p=G.players[G.turn];
  if(G.ph!=='play'||G.pause||!p||p.id!==id)return;
  const bad=m=>{if(id===me)flash(m);else if(conns[id])conns[id].send({t:'bad',m})};
  const r=look(G.cat,x);
  if(!r){const q=CATS[G.cat][0].replace(/^Name an? /,'')+': '+x.trim().slice(0,25);G.miss=G.miss||[];if(G.miss.indexOf(q)<0&&G.miss.length<40)G.miss.push(q);return bad('Not on my list. Try another!')}
  const key=G.cat+'|'+r[0];
  if(G.used[key])return bad('Already used this game!');
  G.used[key]=1;clearTimeout(timer);deadline=0;
  const pts=rate(G.cat,r[0],r[1]);p.score+=pts;
  let m=p.name+': '+x.trim().slice(0,30)+' (+'+pts+', '+TL[pts]+(rate.f>1.15?', rarely given!':rate.f<.85?', popular pick':'')+')';
  while(p.score>=p.nl){p.nl+=50;if(p.lives<5){p.lives++;m+=' +1 life!'}}
  G.say={id:p.id,x:x.trim().slice(0,22),p:pts,t:pts};G.msg=m;after();
}
function drop(id){
  delete conns[id];if(!G)return;
  const i=G.players.findIndex(p=>p.id===id);if(i<0)return;
  if(G.ph==='lobby'){G.players.splice(i,1);push();return}
  const p=G.players[i];p.alive=false;p.lives=0;
  if(G.ph!=='play')return push();
  if(i===G.turn&&!G.pause){clearTimeout(timer);after()}
  else if(ended())end();else push();
}

/* ---------- client ---------- */
function joinRoom(){
  nm=$('nm').value.trim()||'Player';room=$('rc').value.trim().toUpperCase();
  if(room.length!==4)return alert('Enter the 4-letter room code.');
  peer=new Peer();
  peer.on('open',id=>{
    me=id;conn=peer.connect('bbash-'+room,{reliable:true});
    conn.on('open',()=>conn.send({t:'join',n:nm}));
    conn.on('data',d=>{
      if(d.t==='s')render(d.s);
      else if(d.t==='bad')flash(d.m);
      else if(d.t==='full'){alert('That room is full or already started.');location.reload()}
    });
    conn.on('close',()=>{alert('Disconnected from the room.');location.reload()});
  });
  peer.on('error',e=>alert(e.type==='peer-unavailable'?'Room not found. Check the code.':'Network error: '+e.type));
}
function send(){
  const x=$('ans').value.trim();if(!x)return;$('ans').value='';
  if(isHost)answer(me,x);else conn.send({t:'ans',x});
}

/* ---------- display ---------- */
function show(id){['home','lobby','game','over'].forEach(x=>$(x).classList.toggle('hid',x!==id))}
function pl(id,s){
  $(id).innerHTML=s.players.map((p,i)=>`<div class="pl${s.ph==='play'&&!s.pause&&i===s.turn?' turn':''}${p.alive?'':' dead'}"><span>${esc(p.name)}${p.id===me?' (you)':''}</span><span>${s.ph==='lobby'?'':'<b class="hp">'+'♥'.repeat(Math.max(0,p.lives))+'</b>'+p.score}</span></div>`).join('');
}
function flash(m){
  $('mg').textContent=m;$('mg').style.color='var(--coral)';
  $('ans').classList.add('shake');setTimeout(()=>$('ans').classList.remove('shake'),300);
}
function seats(s){
  const n=s.players.length,mi=Math.max(0,s.players.findIndex(p=>p.id===me));let h='',px=50,py=52;
  s.players.forEach((p,i)=>{
    const a=(90+((i-mi+n)%n)*360/n)*Math.PI/180,x=50+40*Math.cos(a),y=52+34*Math.sin(a),hue=(i*67+190)%360;
    if(i===s.turn){px=50+(x-50)*.6;py=52+(y-52)*.6}
    h+=`<div class="seat${i===s.turn&&p.alive&&!s.pause?' act':''}${p.alive?'':' dead'}${s.say&&s.say.id===p.id?' talk':''}" style="left:${x}%;top:${y}%">${s.say&&s.say.id===p.id?`<div class="say t${s.say.t}"><span>${esc(s.say.x)}</span><small>+${s.say.p} ${TL[s.say.t]}</small></div>`:''}<svg class="crit" viewBox="0 0 9 8" width="40" height="36" shape-rendering="crispEdges" fill="hsl(${hue} 80% 62%)"><path d="M4 0h1v1H4zM3 1h3v1H3zM0 2h9v1H0zM1 3h7v1H1zM2 4h5v1H2zM1 5h3v1H1zM5 5h3v1H5zM1 6h2v1H1zM6 6h2v1H6zM0 7h2v1H0zM7 7h2v1H7z"/><path d="M3 3h1v1H3zM5 3h1v1H5z" fill="#050a14"/></svg><div class="rock r${i%5}"></div><div class="nm">${esc(p.name)}</div><b class="hp">${'♥'.repeat(Math.max(0,p.lives))}</b></div>`;
  });
  $('seats').innerHTML=h;$('puff').style.left=px+'%';$('puff').style.top=py+'%';
}
function render(s){
  S=s;tot=s.tot;dl=s.left?Date.now()+s.left:0;
  const tt=s.players.reduce((a,p)=>a+p.score,0)*4;
  $('depth').textContent=(tt<60?'Sunlight zone':tt<140?'Twilight zone':tt<240?'Midnight zone':tt<360?'The abyss':'The trench')+' · '+tt+' m';
  document.body.style.setProperty('--d',s.ph==='lobby'?0:Math.min(1,tt/400));
  if(s.ph==='lobby'){
    show('lobby');$('rc2').textContent=s.room;pl('pl1',s);
    $('st').classList.toggle('hid',!isHost);$('wt').textContent=isHost?'Up to 5 players can join.':'Waiting for the host to start...';
  }else if(s.ph==='play'){
    show('game');seats(s);
    $('hroom').textContent=s.room;$('halive').textContent=s.players.filter(p=>p.alive).length+'/'+s.players.length;$('plab').textContent='Prompt '+(s.n||1);
    const mp=s.players.find(p=>p.id===me);$('mylives').textContent='♥'+(mp?Math.max(0,mp.lives):0);
    const cur=s.players[s.turn],mine=cur&&cur.id===me&&cur.alive&&!s.pause;
    $('who').textContent=s.pause?'':(mine?'Your turn!':cur.name+"'s turn");
    $('pr').textContent=s.cat;$('ans').placeholder=mine?'Type your answer...':cur.name+' is up...';
    $('ans').disabled=$('go').disabled=!mine;
    $('mg').textContent=s.msg;$('mg').style.color=s.msg.startsWith('💥')?'var(--coral)':'var(--ok)';
    if(mine)$('ans').focus();
  }else{
    show('over');$('miss').textContent=s.miss&&s.miss.length?'Rejected answers: '+s.miss.join(', '):'';pl('pl3',{...s,players:[...s.players].sort((a,b)=>b.score-a.score)});
    $('win').textContent=s.win?'🏆 '+s.win+' wins!':'Game over';
    $('again').classList.toggle('hid',!isHost);$('wt2').textContent=isHost?'':'Waiting for the host...';
  }
}
const PUF='<svg viewBox="0 0 16 12" width="150" height="112" shape-rendering="crispEdges" fill="currentColor"><path d="M5 2h6v1H5zM3 3h10v1H3zM2 4h12v1H2zM1 5h14v1H1zM1 6h14v1H1zM1 7h14v1H1zM2 8h12v1H2zM3 9h10v1H3zM5 10h6v1H5zM6 1h1v1H6zM9 1h1v1H9zM3 2h1v1H3zM12 2h1v1h-1zM14 4h1v1h-1zM14 8h1v1h-1zM2 10h1v1H2zM13 10h1v1h-1zM6 11h1v1H6zM9 11h1v1H9zM0 4h1v5H0z"/><path d="M10 4h2v2h-2zM13 7h2v1h-2z" fill="#050a14"/><path d="M10 4h1v1h-1z" fill="#fff"/><path d="M4 8h8v1H4zM5 9h6v1H5z" fill="#fff" opacity=".3"/><path d="M5 4h1v1H5zM8 3h1v1H8zM6 6h1v1H6zM3 6h1v1H3z" fill="#7a4b00" opacity=".35"/><path d="M7 8h2v1H7z" fill="#fff" opacity=".5"/></svg>';
(function loop(){
  if(S&&S.ph==='play'){
    const el=$('puff'),boom=S.pause&&S.msg.startsWith('💥'),k=boom?'b':'p';
    if(el.dataset.k!==k){el.dataset.k=k;el.innerHTML=boom?'<div class="boom">POP!</div>':PUF}
    const f=(!S.pause&&dl)?Math.min(1,Math.max(0,(dl-Date.now())/tot)):0,g=S.pause?0:1-f;
    if(!boom){el.firstChild.style.transform='scale('+(.8+g*.9)+')';el.style.color='hsl('+(48-g*45)+' 95% 62%)'}
    $('fuse').style.width=(f*100)+'%';$('fuse').style.background=f<.3?'var(--coral)':'';
  }
  requestAnimationFrame(loop);
})();
const bb=document.createElement('div');bb.id='bubs';
for(let i=0;i<16;i++){const b=document.createElement('i'),z=4+(Math.random()*8|0);b.style.cssText='left:'+Math.random()*100+'%;width:'+z+'px;height:'+z+'px;animation-duration:'+(9+Math.random()*12)+'s;animation-delay:-'+Math.random()*18+'s';bb.appendChild(b)}
const KELP='<svg viewBox="0 0 12 24" shape-rendering="crispEdges" fill="#0b2238"><path d="M5 0h2v24H5zM3 4h2v2H3zM7 8h2v2H7zM3 12h2v2H3zM7 16h2v2H7zM3 20h2v2H3z"/></svg>';
[[1,70],[5,110],[9,60],[88,90],[93,130],[97,70]].forEach(([l,hh])=>{const k=document.createElement('div');k.style.cssText='position:absolute;bottom:0;left:'+l+'%;width:'+hh/2.2+'px;height:'+hh+'px;opacity:.9';k.innerHTML=KELP;k.firstChild.setAttribute('width','100%');k.firstChild.setAttribute('height','100%');bb.appendChild(k)});
document.body.prepend(bb);
$('mk').onclick=host;$('jn').onclick=joinRoom;
$('st').onclick=start;$('again').onclick=()=>{G.ph='lobby';push()};
$('go').onclick=send;$('ans').onkeydown=e=>{if(e.key==='Enter')send()};
</script></body></html>
